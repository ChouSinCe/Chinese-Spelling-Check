<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>汉字小径 · My Sentences</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5D4E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro/dist/index.js"></script>
<style>
  :root {
    --bg: #F5EFDC; --bg-elev: #FFFDF7; --ink: #2A2118; --ink-soft: #6E6048;
    --forest: #2F5D4E; --forest-deep: #1E3F35; --gold: #C98A2B; --gold-soft: #F0D9A6;
    --sky: #3D7A97; --card-border: rgba(42,33,24,0.10);
    --shadow: 0 6px 18px rgba(30,30,20,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16211C; --bg-elev: #1D2B24; --ink: #F0EBDC; --ink-soft: #B7C2B7;
      --forest: #7FC0A4; --forest-deep: #A9D9C1; --gold: #E7B65B; --gold-soft: #3A3220;
      --sky: #7FBEDD; --card-border: rgba(240,235,220,0.12);
      --shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: 'Baloo 2', system-ui, sans-serif; }
  .hanzi { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .app { max-width: 780px; margin: 0 auto; padding: 20px 18px 48px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mascot { font-size: 34px; line-height: 1; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 800; color: var(--forest-deep); }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); font-weight: 500; }

  .toggles { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .toggle-btn { font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid var(--card-border); background: var(--bg-elev); color: var(--ink); padding: 8px 14px; border-radius: 999px; }
  .toggle-btn[aria-pressed="true"] { background: var(--forest); border-color: var(--forest); color: #fff; }
  .toggle-btn[disabled] { opacity: .4; cursor: default; }
  #testModeBtn[aria-pressed="true"] { background: #C0392B; border-color: #C0392B; }

  .test-banner {
    background: var(--forest); color: #fff; border-radius: 14px; padding: 12px 16px;
    font-size: 13px; font-weight: 600; margin-bottom: 18px;
  }

  .mic-banner { background: var(--gold-soft); border: 1px solid var(--card-border); border-radius: 12px; padding: 8px 14px; font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; }
  .mic-banner[hidden] { display: none; }

  .stats-bar {
    background: var(--forest); color: #fff; border-radius: 14px; padding: 12px 16px;
    font-size: 14px; font-weight: 700; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .stats-bar .stats-sub { font-weight: 500; font-size: 12px; opacity: .85; margin-top: 2px; }
  .stats-bar.empty { background: var(--bg-elev); color: var(--ink-soft); font-weight: 500; border: 1px dashed var(--card-border); }

  .story-card { background: var(--bg-elev); border: 1px solid var(--card-border); border-radius: 20px; box-shadow: var(--shadow); padding: 22px 20px 20px; overflow-x: auto; }

  .add-sentence-panel { background: var(--bg); border: 1px dashed var(--card-border); border-radius: 14px; padding: 14px; margin-bottom: 18px; }
  .add-sentence-panel label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 0 0 4px; }
  .add-sentence-panel textarea {
    width: 100%; font-family: 'Noto Sans SC', sans-serif; font-size: 18px; padding: 8px 10px;
    border-radius: 10px; border: 1px solid var(--card-border); background: var(--bg-elev); color: var(--ink); resize: vertical;
  }
  .pinyin-preview-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .pinyin-preview-item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--bg-elev); border: 1px solid var(--card-border); border-radius: 10px; padding: 6px 8px; }
  .pinyin-preview-item .pc { font-size: 22px; }
  .pinyin-preview-item input { width: 66px; font-size: 12px; text-align: center; border: 1px solid var(--card-border); border-radius: 6px; padding: 3px; background: var(--bg); color: var(--ink); font-family: inherit; }
  .pinyin-preview-item .punct-label { font-size: 10px; color: var(--ink-soft); }
  .empty-state { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 24px 0; }

  .sentence-list { display: flex; flex-direction: column; gap: 14px; }
  .sentence { background: var(--bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 6px; }
  .sentence-row { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
  .sentence-btns { display: flex; gap: 6px; flex: 0 0 auto; }
  .sentence-text { font-size: 26px; line-height: 2.3; flex: 1; min-width: 0; }
  ruby { ruby-align: center; }
  rt { font-family: 'Baloo 2', system-ui, sans-serif; font-size: 0.36em; font-weight: 700; color: var(--sky); visibility: hidden; }
  .pinyin-on rt { visibility: visible; }
  .tok { font: inherit; background: none; border: none; cursor: pointer; color: inherit; padding: 0 1px; border-radius: 6px; }
  .tok:hover, .tok:focus-visible { background: var(--gold-soft); }
  .punct { font-size: 26px; color: var(--ink-soft); }

  .speak-btn, .mic-btn { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--card-border); background: var(--bg-elev); font-size: 16px; cursor: pointer; margin-top: 4px; }
  .speak-btn { color: var(--forest); }
  .speak-btn:active { background: var(--forest); color: #fff; }
  .mic-btn { color: var(--sky); }
  .mic-btn.listening { background: #C0392B; border-color: #C0392B; color: #fff; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(192,57,43,.4);} 50% { box-shadow: 0 0 0 8px rgba(192,57,43,0);} }
  .delete-sentence-btn { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 16px; padding: 4px; margin-top: 4px; }

  .reading-feedback { font-size: 22px; line-height: 2.3; padding-top: 2px; }
  .reading-feedback[hidden] { display: none; }
  .reading-feedback rt { visibility: visible; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 0.4em; font-weight: 700; }
  .reading-feedback ruby { ruby-align: center; }
  .rf-correct { color: var(--forest); }
  .rf-wrong { color: #C0392B; }
  .rf-wrong rt { color: #C0392B; }
  .rf-missing { color: #C0392B; opacity: .75; }
  .rf-missing rt { color: #C0392B; }
  .reading-summary { font-family: 'Baloo 2', system-ui, sans-serif; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .reading-summary.ok { color: var(--forest); font-weight: 700; }

  .btn { font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; border-radius: 999px; padding: 10px 18px; border: none; }
  .btn.primary { background: var(--forest); color: #fff; }
  .btn.ghost { background: none; border: 1px solid var(--card-border); color: var(--ink); }

  .tooltip { position: fixed; z-index: 20; background: var(--forest-deep); color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; max-width: 220px; box-shadow: var(--shadow); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
  .tooltip.show { opacity: 1; transform: translateY(0); }
  .tooltip .tp-p { color: var(--gold-soft); font-size: 12px; margin-bottom: 2px; }

  footer.note { text-align: center; color: var(--ink-soft); font-size: 12px; margin-top: 26px; }
  @media (max-width: 420px) { .sentence-text { font-size: 23px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mascot" aria-hidden="true">🐉</div>
      <div><h1>我的句子</h1><p>My Sentences · reading practice</p></div>
    </div>
  </header>

  <div class="toggles">
    <button class="toggle-btn" id="pinyinToggle" aria-pressed="false" type="button">Show pinyin</button>
    <button class="toggle-btn" id="speakAllBtn" type="button">🔊 Read all</button>
    <button class="toggle-btn" id="shuffleBtn" type="button">🔀 Shuffle order</button>
    <button class="toggle-btn" id="testModeBtn" aria-pressed="false" type="button">🧪 Start Testing</button>
  </div>

  <div class="mic-banner" id="micBanner" hidden>🎤 This browser doesn't support speech recognition — try Chrome. You can still tap words and listen to the audio.</div>

  <main class="story-card" id="storyCard"></main>
  <footer class="note">Tap any word to hear its pinyin. Tap 🔊 to hear it. Tap 🎤 and read it yourself — it checks automatically.<br><span style="opacity:.5;">build v6</span></footer>
</div>

<div class="tooltip" id="tooltip" role="status"></div>

<script>
(function(){
  "use strict";

  var customSentences = []; // [{id, tokens}, ...]
  var readingResults = {};  // { [id]: {correct, total} }

  function makeId(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function loadState(){
    try {
      var raw = window.localStorage.getItem("hanziTrailLocalState");
      if (raw){
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed.customSentences)){
          customSentences = parsed.customSentences.map(function(entry){
            // migrate old saves (plain token arrays) into {id, tokens}
            if (entry && entry.tokens && entry.id) return entry;
            return { id: makeId(), tokens: entry };
          });
        }
        if (parsed.readingResults && typeof parsed.readingResults === "object") readingResults = parsed.readingResults;
      }
    } catch(e){}
  }
  function saveState(){
    try { window.localStorage.setItem("hanziTrailLocalState", JSON.stringify({customSentences: customSentences, readingResults: readingResults})); } catch(e){}
  }

  function shuffleArray(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function computeStats(){
    var checked = 0, total = 0, correct = 0;
    customSentences.forEach(function(entry){
      var r = readingResults[entry.id];
      if (r){ checked++; total += r.total; correct += r.correct; }
    });
    return { checked: checked, totalSentences: customSentences.length, total: total, correct: correct, pct: total > 0 ? Math.round((correct / total) * 100) : null };
  }

  function buildStatsBar(){
    var s = computeStats();
    if (s.checked === 0){
      return '<div class="stats-bar empty" id="statsBar">📊 No reading checks yet — tap 🎤 on a sentence to start tracking accuracy.</div>';
    }
    return '<div class="stats-bar" id="statsBar">📊 ' + s.pct + '% read correctly'
      + '<div class="stats-sub">' + s.checked + ' of ' + s.totalSentences + ' sentences checked · ' + s.correct + ' / ' + s.total + ' hanzi correct</div></div>';
  }

  function refreshStatsBar(){
    var el = document.getElementById("statsBar");
    if (el) el.outerHTML = buildStatsBar();
  }

  var storyCard = document.getElementById("storyCard");
  var pinyinToggle = document.getElementById("pinyinToggle");
  var speakAllBtn = document.getElementById("speakAllBtn");
  var testModeBtn = document.getElementById("testModeBtn");
  var tooltip = document.getElementById("tooltip");
  var pinyinOn = false;
  var testMode = false;

  function sentencePlainText(sentence){ return sentence.map(function(tok){ return tok[0]; }).join(""); }

  function speak(text){
    try {
      if (!("speechSynthesis" in window)) return;
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = "zh-CN"; utter.rate = 0.85;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    } catch(e){}
  }

  function isHanzi(ch){ return /[\u4e00-\u9fa5]/.test(ch); }

  function autoPinyin(ch){
    try {
      var lib = window.pinyinPro;
      if (lib && typeof lib.pinyin === "function"){
        var result = lib.pinyin(ch, { toneType: "symbol" });
        if (Array.isArray(result)) result = result[0];
        if (typeof result === "string") return result;
      }
    } catch(e){}
    return "";
  }

  function showTooltip(target, pinyin, meaning){
    tooltip.innerHTML = '<div class="tp-p">' + pinyin + '</div>' + (meaning ? meaning : "");
    var rect = target.getBoundingClientRect();
    tooltip.style.left = Math.max(8, Math.min(window.innerWidth - 230, rect.left)) + "px";
    tooltip.style.top = (rect.bottom + 8) + "px";
    tooltip.classList.add("show");
    window.clearTimeout(showTooltip._t);
    showTooltip._t = window.setTimeout(function(){ tooltip.classList.remove("show"); }, 2600);
  }

  // ---- Automatic reading check (real microphone speech recognition) ----
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var speechSupported = !!SpeechRecognitionCtor;
  var activeRecognition = null;

  function targetCharsFor(sentence){
    var chars = [];
    sentence.forEach(function(tok){ if (tok.length < 3) return; chars.push({ ch: tok[0], py: tok[1] }); });
    return chars;
  }

  function alignReading(target, heardRaw){
    var heard = heardRaw.replace(/[\s，。！？、,\.!\?]/g, "").split("");
    var n = target.length, m = heard.length;
    var dp = [];
    for (var i = 0; i <= n; i++){ dp.push(new Array(m + 1).fill(0)); dp[i][0] = i; }
    for (var j = 0; j <= m; j++) dp[0][j] = j;
    for (i = 1; i <= n; i++){
      for (j = 1; j <= m; j++){
        dp[i][j] = target[i-1].ch === heard[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
      }
    }
    var ops = []; i = n; j = m;
    while (i > 0 || j > 0){
      if (i > 0 && j > 0 && target[i-1].ch === heard[j-1]){ ops.push({type:"match", c:target[i-1].ch, py:target[i-1].py}); i--; j--; }
      else if (i > 0 && j > 0 && dp[i][j] === dp[i-1][j-1] + 1){ ops.push({type:"sub", c:target[i-1].ch, py:target[i-1].py, heard:heard[j-1]}); i--; j--; }
      else if (i > 0 && dp[i][j] === dp[i-1][j] + 1){ ops.push({type:"del", c:target[i-1].ch, py:target[i-1].py}); i--; }
      else { ops.push({type:"ins", heard:heard[j-1]}); j--; }
    }
    ops.reverse();
    return ops;
  }

  function renderReadingFeedback(sIdx, ops, entryId){
    var box = document.getElementById("fb-" + sIdx);
    if (!box) return;
    var targetOps = ops.filter(function(o){ return o.type !== "ins"; });
    var correctCount = targetOps.filter(function(o){ return o.type === "match"; }).length;
    var wrongChars = [];
    var line = '<div class="hanzi">';
    targetOps.forEach(function(o){
      if (o.type === "match") line += '<span class="rf-correct">' + o.c + '</span>';
      else if (o.type === "sub"){ line += '<ruby class="rf-wrong" title="You said: ' + o.heard + '">' + o.c + '<rt>' + o.py + '</rt></ruby>'; wrongChars.push(o.c); }
      else { line += '<ruby class="rf-missing" title="Skipped">' + o.c + '<rt>' + o.py + '</rt></ruby>'; wrongChars.push(o.c); }
    });
    line += '</div>';
    var summary = correctCount === targetOps.length
      ? '<div class="reading-summary ok">All ' + targetOps.length + ' correct! 🎉</div>'
      : '<div class="reading-summary">' + correctCount + ' / ' + targetOps.length + ' correct — practice: ' + wrongChars.join("、") + '</div>';
    box.innerHTML = line + summary;
    box.hidden = false;

    readingResults[entryId] = { correct: correctCount, total: targetOps.length };
    saveState();
    refreshStatsBar();
  }

  function startListening(entry, sIdx, btn){
    var sentence = entry.tokens;
    if (!speechSupported){ document.getElementById("micBanner").hidden = false; return; }
    if (activeRecognition){ try { activeRecognition.stop(); } catch(e){} }
    var recognition = new SpeechRecognitionCtor();
    activeRecognition = recognition;
    recognition.lang = "zh-CN";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    btn.classList.add("listening");
    var box = document.getElementById("fb-" + sIdx);
    if (box) box.hidden = true;

    recognition.onresult = function(e){
      var heard = e.results[0][0].transcript;
      renderReadingFeedback(sIdx, alignReading(targetCharsFor(sentence), heard), entry.id);
    };
    recognition.onerror = function(e){
      var box2 = document.getElementById("fb-" + sIdx);
      if (!box2) return;
      var msg = "Couldn't check that (" + e.error + ") — try again.";
      if (e.error === "not-allowed" || e.error === "service-not-allowed") msg = "Microphone access is blocked — allow it for this page in Chrome's site settings.";
      else if (e.error === "no-speech") msg = "Didn't hear anything — try again a bit louder.";
      else if (e.error === "network") msg = "Network error — speech recognition needs internet access to Google's servers.";
      else if (e.error === "audio-capture") msg = "No microphone found — check one is connected.";
      box2.innerHTML = '<div class="reading-summary">' + msg + '</div>';
      box2.hidden = false;
    };
    recognition.onend = function(){ btn.classList.remove("listening"); activeRecognition = null; };
    try { recognition.start(); } catch(e){ btn.classList.remove("listening"); }
  }

  // ---- Rendering --------------------------------------------------------
  function render(){
    var html = '';
    html += buildStatsBar();

    if (testMode){
      html += '<div class="test-banner">🧪 Testing mode — no audio, no pinyin, no tap-to-reveal. Have Jacob read each sentence from memory, then tap 🎤 to check it.</div>';
    } else {
      html += '<div class="add-sentence-panel">';
      html += '<label for="customText">Type or paste one or more Chinese sentences (press Enter between each)</label>';
      html += '<textarea id="customText" rows="4" placeholder="我爱吃苹果。&#10;今天天气很好。&#10;我们一起去公园。"></textarea>';
      html += '<button type="button" class="btn ghost" id="previewPinyinBtn" style="margin-top:8px;">Preview pinyin</button>';
      html += '<div id="pinyinPreviewArea"></div>';
      html += '</div>';
    }

    if (customSentences.length === 0){
      html += '<div class="empty-state">No sentences yet — add one above! 👆</div>';
    } else {
      html += '<div class="sentence-list">';
      customSentences.forEach(function(entry, sIdx){
        var sentence = entry.tokens;
        html += '<div class="sentence"><div class="sentence-row"><div class="sentence-text hanzi">';
        if (testMode){
          sentence.forEach(function(tok){
            html += tok.length < 3 ? '<span class="punct">' + tok[0] + '</span>' : '<span>' + tok[0] + '</span>';
          });
        } else {
          sentence.forEach(function(tok, tIdx){
            if (tok.length < 3) html += '<span class="punct">' + tok[0] + '</span>';
            else html += '<button type="button" class="tok" data-s="' + sIdx + '" data-t="' + tIdx + '"><ruby>' + tok[0] + '<rt>' + tok[1] + '</rt></ruby></button>';
          });
        }
        html += '</div><div class="sentence-btns">';
        if (!testMode) html += '<button type="button" class="speak-btn" data-speak-s="' + sIdx + '" aria-label="Hear this sentence">🔊</button>';
        html += '<button type="button" class="mic-btn" data-mic-s="' + sIdx + '" aria-label="Read this sentence and get checked">🎤</button>';
        if (!testMode) html += '<button type="button" class="delete-sentence-btn" data-del-s="' + sIdx + '" aria-label="Remove this sentence" title="Remove">🗑️</button>';
        html += '</div></div><div class="reading-feedback" id="fb-' + sIdx + '" hidden></div></div>';
      });
      html += '</div>';
    }

    storyCard.innerHTML = html;
    storyCard.classList.toggle("pinyin-on", pinyinOn && !testMode);

    storyCard.querySelectorAll(".tok").forEach(function(btn){
      btn.addEventListener("click", function(){
        var s = customSentences[parseInt(btn.getAttribute("data-s"), 10)].tokens;
        var tok = s[parseInt(btn.getAttribute("data-t"), 10)];
        showTooltip(btn, tok[1], tok[2]);
      });
    });
    storyCard.querySelectorAll("[data-speak-s]").forEach(function(btn){
      btn.addEventListener("click", function(){ speak(sentencePlainText(customSentences[parseInt(btn.getAttribute("data-speak-s"), 10)].tokens)); });
    });
    storyCard.querySelectorAll("[data-mic-s]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var sIdx = parseInt(btn.getAttribute("data-mic-s"), 10);
        startListening(customSentences[sIdx], sIdx, btn);
      });
    });
    storyCard.querySelectorAll("[data-del-s]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var i = parseInt(btn.getAttribute("data-del-s"), 10);
        delete readingResults[customSentences[i].id];
        customSentences.splice(i, 1);
        saveState();
        render();
      });
    });

    var previewBtn = document.getElementById("previewPinyinBtn");
    if (previewBtn){
      var previewArea = document.getElementById("pinyinPreviewArea");
      var textArea = document.getElementById("customText");
      var lastLines = null;

      previewBtn.addEventListener("click", function(){
      var rawLines = (textArea.value || "").split(/\r?\n/)
        .map(function(l){ return l.replace(/\s+/g, ""); })
        .filter(function(l){ return l.length > 0; });
      if (!rawLines.length) return;
      lastLines = rawLines.map(function(line){ return line.split(""); });

      var rows = '';
      lastLines.forEach(function(chars, li){
        if (lastLines.length > 1) rows += '<div style="margin-top:10px;font-size:12px;font-weight:700;color:var(--ink-soft);">Sentence ' + (li + 1) + '</div>';
        rows += '<div class="pinyin-preview-row">';
        chars.forEach(function(ch, i){
          if (isHanzi(ch)){
            var guess = autoPinyin(ch);
            rows += '<div class="pinyin-preview-item"><span class="pc hanzi">' + ch + '</span><input type="text" data-li="' + li + '" data-ci="' + i + '" value="' + guess + '" placeholder="pinyin"></div>';
          } else {
            rows += '<div class="pinyin-preview-item"><span class="pc hanzi">' + ch + '</span><span class="punct-label">punct.</span></div>';
          }
        });
        rows += '</div>';
      });
      rows += '<button type="button" class="btn primary" id="saveCustomBtn" style="margin-top:4px;">Save ' + (lastLines.length > 1 ? lastLines.length + ' sentences' : 'sentence') + '</button>';
      previewArea.innerHTML = rows;

      document.getElementById("saveCustomBtn").addEventListener("click", function(){
        lastLines.forEach(function(chars, li){
          var tokens = [];
          chars.forEach(function(ch, i){
            if (isHanzi(ch)){
              var inputEl = previewArea.querySelector('input[data-li="' + li + '"][data-ci="' + i + '"]');
              var p = inputEl ? inputEl.value.trim() : "";
              tokens.push([ch, p || "?", ""]);
            } else {
              tokens.push([ch]);
            }
          });
          customSentences.push({ id: makeId(), tokens: tokens });
        });
        saveState();
        render();
      });
    });
    }
  }

  pinyinToggle.addEventListener("click", function(){
    pinyinOn = !pinyinOn;
    pinyinToggle.setAttribute("aria-pressed", String(pinyinOn));
    storyCard.classList.toggle("pinyin-on", pinyinOn);
  });
  document.getElementById("speakAllBtn").addEventListener("click", function(){
    speak(customSentences.map(function(entry){ return sentencePlainText(entry.tokens); }).join("，"));
  });
  document.getElementById("shuffleBtn").addEventListener("click", function(){
    shuffleArray(customSentences);
    saveState();
    render();
  });
  testModeBtn.addEventListener("click", function(){
    testMode = !testMode;
    testModeBtn.textContent = testMode ? "🧪 Exit Testing" : "🧪 Start Testing";
    testModeBtn.setAttribute("aria-pressed", String(testMode));
    pinyinToggle.disabled = testMode;
    speakAllBtn.disabled = testMode;
    render();
  });
  document.addEventListener("click", function(e){ if (!e.target.closest(".tok")) tooltip.classList.remove("show"); });

  loadState();
  document.getElementById("micBanner").hidden = speechSupported;
  render();

  if ("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
</body>
</html>
